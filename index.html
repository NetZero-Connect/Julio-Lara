<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Júlio Lara · NetZero</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">

<style>

    /* ============================================================
       CORES DA MARCA
       ============================================================ */

    :root {

        --green:          #08A75A;   /* verde principal NetZero */
        --green-dark:     #03522C;   /* verde escuro */
        --green-deep:     #023B20;   /* verde ainda mais profundo */

        --white:          #FFFFFF;   /* branco */
        --white-soft:     #F4FAF7;   /* branco levemente esverdeado */

        --gray-light:     #C9D8D0;   /* cinza claro */
        --gray-medium:    #9FB2A8;   /* cinza médio */

        --text-dark:      #12382A;   /* texto escuro */
    }


    /* ============================================================
       RESET
       ============================================================ */

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }


    /* ============================================================
       FUNDO
       ============================================================ */

    body {

        font-family: 'Manrope', Arial, sans-serif;

        color: var(--white);

        min-height: 100vh;

        display: flex;

        justify-content: center;

        background-color: var(--green);

        /*
        Fundo predominantemente verde,
        com pequenos efeitos de profundidade.
        */

        background-image:

            radial-gradient(
                circle at 50% 5%,
                rgba(255,255,255,0.10),
                transparent 42%
            ),

            radial-gradient(
                circle at 90% 90%,
                rgba(3,82,44,0.30),
                transparent 50%
            ),

            linear-gradient(
                145deg,
                #08A75A 0%,
                #08A75A 45%,
                #057A42 100%
            );

        background-attachment: fixed;
    }


    /* ============================================================
       CONTAINER
       ============================================================ */

    .container {

        width: 100%;

        max-width: 420px;

        padding: 56px 26px 40px;

        text-align: center;
    }


    /* ============================================================
       PERFIL
       ============================================================ */

    .profile {

        margin-bottom: 34px;
    }


    /* ============================================================
       CÍRCULO DA LOGO
       ============================================================ */

    .avatar-wrap {

        position: relative;

        width: 128px;

        height: 128px;

        margin: 0 auto 22px;
    }


    /*
    Anel externo em verde escuro/branco
    */

    .avatar-wrap::before {

        content: "";

        position: absolute;

        inset: -12px;

        border-radius: 50%;

        border: 1px solid rgba(255,255,255,0.30);

        box-shadow:
            0 0 0 6px rgba(255,255,255,0.05),
            0 8px 25px rgba(0,0,0,0.10);
    }


    /*
    Círculo principal
    */

    .avatar {

        position: relative;

        width: 100%;

        height: 100%;

        border-radius: 50%;

        padding: 4px;

        background: linear-gradient(
            135deg,
            var(--white),
            var(--green-dark)
        );

        box-shadow:
            0 10px 30px rgba(0,0,0,0.15);
    }


    /*
    Área interna da logo
    */

    .avatar img {

        display: block;

        width: 100%;

        height: 100%;

        padding: 24px;

        object-fit: contain;

        border-radius: 50%;

        background: var(--white);
    }


    /* ============================================================
       NOME
       ============================================================ */

    h1 {

        font-family: 'Fraunces', serif;

        font-weight: 600;

        font-size: 30px;

        letter-spacing: 0.2px;

        margin-bottom: 8px;

        color: var(--white);
    }


    /* ============================================================
       CARGO
       ============================================================ */

    .cargo {

        color: var(--white-soft);

        font-size: 14px;

        font-weight: 500;
    }


    /* ============================================================
       EMPRESA
       ============================================================ */

    .empresa {

        display: inline-block;

        margin-top: 10px;

        color: var(--white);

        font-size: 12px;

        font-weight: 700;

        letter-spacing: 2.5px;

        text-transform: uppercase;

        opacity: 0.95;
    }


    /* ============================================================
       LINKS
       ============================================================ */

    .links {

        display: flex;

        flex-direction: column;

        gap: 12px;
    }


    .link {

        display: block;

        padding: 16px 18px;

        border-radius: 12px;

        text-decoration: none;

        color: var(--white);

        font-size: 15px;

        font-weight: 600;

        /*
        Fundo branco translúcido
        */

        background: rgba(255,255,255,0.10);

        border: 1px solid rgba(255,255,255,0.28);

        backdrop-filter: blur(8px);

        transition:
            transform 0.18s ease,
            border-color 0.18s ease,
            background 0.18s ease,
            box-shadow 0.18s ease;
    }


    /*
    Hover dos botões
    */

    .link:hover {

        background: rgba(255,255,255,0.18);

        border-color: rgba(255,255,255,0.60);

        transform: translateY(-2px);

        box-shadow:
            0 8px 20px rgba(3,82,44,0.18);
    }


    /* ============================================================
       WHATSAPP
       ============================================================ */

    .link.whatsapp {

        background: var(--green-dark);

        border-color: var(--green-dark);

        color: var(--white);

        box-shadow:
            0 8px 20px rgba(3,82,44,0.20);
    }


    .link.whatsapp:hover {

        background: var(--green-deep);

        border-color: var(--green-deep);

        box-shadow:
            0 10px 26px rgba(3,82,44,0.30);
    }


    /* ============================================================
       RODAPÉ
       ============================================================ */

    footer {

        margin-top: 34px;

        font-size: 12px;

        color: var(--gray-light);

        opacity: 0.90;
    }


    /* ============================================================
       ACESSIBILIDADE
       ============================================================ */

    @media (prefers-reduced-motion: reduce) {

        .link {

            transition: none;
        }

        .link:hover {

            transform: none;
        }
    }

</style>
</head>


<body>

    <div class="container">

        <!-- =====================================================
             PERFIL
             ===================================================== -->

        <div class="profile">

            <div class="avatar-wrap">

                <div class="avatar">

                    <!--
                    COLOQUE A LOGO DA NETZERO COMO:

                    logo-netzero.png

                    na mesma pasta deste arquivo HTML.
                    -->

                    <img
                        src="NetZero logo (full) 1.png"
                        alt="Logo NetZero"
                    >

                </div>

            </div>


            <h1>Júlio Lara</h1>

            <p class="cargo">
                Gerente de Business Development
            </p>

            <span class="empresa">
                NetZero
            </span>

        </div>


        <!-- =====================================================
             LINKS
             ===================================================== -->

        <div class="links">

            <!-- LinkedIn -->

            <a
                class="link"
                href="https://www.linkedin.com/in/julio-lara-6b17a5154?utm_source=share_via&utm_content=profile&utm_medium=member_android"
                target="_blank"
                rel="noopener"
            >
                LinkedIn
            </a>


            <!-- Site -->

            <a
                class="link"
                href="https://netzero.green"
                target="_blank"
                rel="noopener"
            >
                Site
            </a>


            <!-- E-mail -->

            <a
                class="link"
                href="mailto:julio.lara@netzero.green"
            >
                E-mail
            </a>


            <!-- WhatsApp -->

            <a
                class="link whatsapp"
                href="https://wa.me/5531982959259"
                target="_blank"
                rel="noopener"
            >
                WhatsApp
            </a>

        </div>


        <!-- =====================================================
             RODAPÉ
             ===================================================== -->

        <footer>
            Júlio Lara · NetZero
        </footer>

    </div>

</body>
</html>
