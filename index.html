<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maria Fernanda</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f5;
            color: #1f2933;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 50px 25px;
            text-align: center;
        }

        .profile {
            margin-bottom: 30px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #198754;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 7px;
        }

        .cargo {
            color: #198754;
            font-size: 15px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link {
            display: block;
            padding: 16px;
            background: white;
            border-radius: 10px;
            text-decoration: none;
            color: #1f2933;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid #dfe7e1;
            transition: 0.2s;
        }

        .link:hover {
            transform: translateY(-2px);
            border-color: #198754;
        }

        .whatsapp {
            background: #198754;
            color: white;
            border-color: #198754;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #8a9690;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="profile">

            <div class="avatar">
                MF
            </div>

            <h1>Maria Fernanda</h1>

            <p class="cargo">
                Assistente BD
            </p>

        </div>

        <div class="links">

            <a
                class="link whatsapp"
                href="https://wa.me/5531999353447"
                target="_blank">
                WhatsApp
            </a>

            <a
                class="link"
                href="mailto:maria.cardodo@empresa.com">
                E-mail
            </a>

        </div>

        <footer>
            Maria Fernanda
        </footer>

    </div>

</body>
</html>
