<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Júlio Lara · NetZero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
    /* ============================================================
       CORES DA MARCA — edite só aqui para trocar a identidade visual
       ============================================================ */
    :root {
        --carbon:        #08A75A;   /* fundo — preto-carvão (biochar) */
        --carbon-soft:   #FFFFFF;   /* superfícies um pouco mais claras */
        --forest:        #1f4d3a;   /* verde profundo — solo/regeneração */
        --forest-bright: #03522C;   /* verde vivo — destaque, WhatsApp */
        --ember:         #08A75A;   /* dourado-brasa — acento quente */
        --ember-light:   #1c1815;   /* dourado mais claro, para texto */
        --parchment:     #1c1815;   /* texto principal */
        --sage:          #1c1815;   /* texto secundário */
        --muted:         #1c1815;   /* texto terciário / rodapé */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Manrope', Arial, sans-serif;
        color: var(--parchment);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        background-color: var(--carbon);
        /* brilho quente ao fundo + textura sutil de "linhas de cultivo" */
        background-image:
            radial-gradient(circle at 50% 8%, rgba(201,138,43,0.16), transparent 45%),
            radial-gradient(circle at 85% 90%, rgba(69,160,111,0.14), transparent 50%),
            repeating-linear-gradient(120deg, rgba(246,239,228,0.025) 0px, rgba(246,239,228,0.025) 1px, transparent 1px, transparent 26px);
        background-attachment: fixed;
    }

    .container {
        width: 100%;
        max-width: 420px;
        padding: 56px 26px 40px;
        text-align: center;
    }

    .profile { margin-bottom: 34px; }

    /* --- avatar com anel "de casca de árvore" (referência ao biochar) --- */
    .avatar-wrap {
        position: relative;
        width: 128px;
        height: 128px;
        margin: 0 auto 22px;
    }
    .avatar-wrap::before {
        content: "";
        position: absolute;
        inset: -18px;
        border-radius: 50%;
        background: repeating-radial-gradient(
            circle,
            transparent 0px,
            transparent 7px,
            rgba(201,138,43,0.16) 7px 8px,
            transparent 8px 15px,
            rgba(69,160,111,0.14) 15px 16px
        );
        -webkit-mask-image: radial-gradient(circle, black 55%, transparent 78%);
        mask-image: radial-gradient(circle, black 55%, transparent 78%);
    }
    .avatar {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        padding: 3px;
        background: conic-gradient(from 210deg, var(--ember), var(--forest-bright), var(--ember));
    }
    .avatar span {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--carbon-soft);
        font-family: 'Fraunces', serif;
        font-weight: 600;
        font-size: 34px;
        color: var(--parchment);
    }

    h1 {
        font-family: 'Fraunces', serif;
        font-weight: 600;
        font-size: 30px;
        letter-spacing: 0.2px;
        margin-bottom: 8px;
    }
    .cargo {
        color: var(--sage);
        font-size: 14px;
        font-weight: 500;
    }
    .empresa {
        display: inline-block;
        margin-top: 10px;
        color: var(--ember-light);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2.5px;
        text-transform: uppercase;
    }

    .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .link {
        display: block;
        padding: 16px 18px;
        border-radius: 12px;
        text-decoration: none;
        color: var(--parchment);
        font-size: 15px;
        font-weight: 600;
        background: rgba(246,239,228,0.045);
        border: 1px solid rgba(246,239,228,0.10);
        backdrop-filter: blur(6px);
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }
    .link:hover {
        border-color: rgba(201,138,43,0.55);
        background: rgba(246,239,228,0.07);
        transform: translateY(-2px);
    }
    .link.whatsapp {
        background: linear-gradient(135deg, var(--forest), var(--forest-bright));
        border-color: transparent;
        color: #fff;
    }
    .link.whatsapp:hover {
        box-shadow: 0 10px 24px -8px rgba(69,160,111,0.55);
    }

    footer {
        margin-top: 34px;
        font-size: 12px;
        color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
        .link { transition: none; }
        .link:hover { transform: none; }
    }
</style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <div class="avatar-wrap">
                <div class="avatar"><span>JL</span></div>
            </div>
            <h1>Júlio Lara</h1>
            <p class="cargo">Gerente de Business Development</p>
            <span class="empresa">NetZero</span>
        </div>

        <div class="links">
            <!-- troque o href abaixo pelo link real do seu LinkedIn -->
            <a class="link" href="https://www.linkedin.com/in/julio-lara-6b17a5154?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" rel="noopener">LinkedIn</a>
            <a class="link" href="https://netzero.green" target="_blank" rel="noopener">Site</a>
            <a class="link" href="mailto:julio.lara@netzero.green">E-mail</a>
            <a class="link whatsapp" href="https://wa.me/5531982959259" target="_blank" rel="noopener">WhatsApp</a>
        </div>

        <footer>Júlio Lara · NetZero</footer>
    </div>
</body>
</html>

</body>
</html>
